services:
  postgres:
    image: postgres:16-alpine
    container_name: baganmec-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-baganmec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-baganmec}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bagan_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baganmec-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-baganmec}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-mlbb-tournament-super-secret-key-2026-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    networks:
      - bagan_network

volumes:
  postgres_data:
    name: baganmec_postgres_data

networks:
  bagan_network:
    name: baganmec_network
